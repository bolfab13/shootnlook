<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Equestre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="shootings" class="tab">
  <h2>Shootings</h2>
  <div class="bloc-recherche full-w shooting-filters">
    <label class="check-ambassadeur">
      <input type="checkbox" id="filtre-shootings-a-venir" checked>
      Afficher uniquement les shootings a venir
    </label>
  </div>
  <table id="table-shootings">
    <thead>
      <tr><th>Nom</th><th>Type</th><th>Lieu</th><th>Cavalier(e)</th><th>Dates</th><th>Statut</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
<section id="reglages" class="tab">
  <h2>Reglages</h2>
  <form id="form-reglages">
    <label class="check-ambassadeur">
      <input type="checkbox" id="rg-shootings-a-venir" checked>
      Afficher les shootings a venir par defaut
    </label>
    <button type="submit">Enregistrer</button>
  </form>
</section>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
