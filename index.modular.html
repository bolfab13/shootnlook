<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShootnLook</title>
  <style>
    #mobile-debug{position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;max-height:42vh;overflow:auto;padding:12px;border:1px solid #f66;border-radius:8px;background:#220;color:#fff;font:12px/1.4 monospace;box-shadow:0 4px 20px #0008}
    #mobile-debug[hidden]{display:none}
    #mobile-debug header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font:600 14px system-ui}
    #mobile-debug button{border:1px solid #faa;border-radius:5px;background:#511;color:#fff;padding:4px 8px}
    #mobile-debug pre{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div id="app"></div>
  <aside id="mobile-debug" hidden aria-live="polite">
    <header><span>Diagnostic mobile</span><button id="mobile-debug-clear" type="button">Effacer</button></header>
    <div id="mobile-debug-log"></div>
  </aside>
  <script>
    (() => {
      const panel = document.getElementById('mobile-debug');
      const log = document.getElementById('mobile-debug-log');
      const add = (label, detail) => {
        panel.hidden = false;
        const item = document.createElement('pre');
        item.textContent = `${label}: ${detail}`;
        log.appendChild(item);
      };
      window.addEventListener('error', event => add('Erreur', `${event.message} (${event.filename || 'inline'}:${event.lineno || 0}:${event.colno || 0})`));
      window.addEventListener('unhandledrejection', event => add('Promesse rejetée', String(event.reason && event.reason.stack || event.reason)));
      document.getElementById('mobile-debug-clear').addEventListener('click', () => { log.textContent = ''; panel.hidden = true; });
    })();
  </script>
  <script type="module" src="./app.modular.js"></script>
</body>
</html>
